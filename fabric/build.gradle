plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}
repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'com.terraformersmc' }
    }
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    // Optional: the config screen shows up in Mod Menu's list when it is installed.
    compileOnly("com.terraformersmc:modmenu:${modmenu_version}") { transitive = false }
    localRuntime("com.terraformersmc:modmenu:${modmenu_version}") { transitive = false }
}

fabricApi {
    // Client gametests: a real client plays scripted scenarios (./gradlew :fabric:runClientGameTest).
    configureTests {
        createSourceSet = true
        modId = 'quickstack-test'
        enableGameTests = false
        enableClientGameTests = true
    }
}

// ./gradlew :fabric:runClientGameTest -Pshowcase [-Pclips=quick_stack,wheel] records the mod page clips instead of testing.
if (project.hasProperty('showcase')) {
    loom.runs.matching { it.name == 'clientGameTest' }.configureEach {
        vmArg '-Dquickstack.showcase=true'
        vmArg "-Dquickstack.showcase.clips=${project.findProperty('clips') ?: ''}"
        vmArg "-Dquickstack.showcase.dir=${rootProject.file('build/showcase').absolutePath}"
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            // ./gradlew :fabric:runClient -Pselfcheck loads every mixin target and quits (see SelfCheck)
            if (project.hasProperty('selfcheck')) {
                vmArg '-Dquickstack.selfcheck=true'
            }
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
