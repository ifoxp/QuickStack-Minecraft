plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'com.terraformersmc' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // @Nullable in common is javax.annotation (jsr305, a Minecraft 1.21.10 library that Loom leaves off the compile classpath)
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    // Optional: the config screen shows up in Mod Menu's list when it is installed.
    modCompileOnly("com.terraformersmc:modmenu:${modmenu_version}") { transitive = false }
    modLocalRuntime("com.terraformersmc:modmenu:${modmenu_version}") { transitive = false }
}

fabricApi {
    // Client gametests: a real client plays scripted scenarios (./gradlew :fabric:runClientGameTest).
    configureTests {
        createSourceSet = true
        modId = 'quickstack-test'
        enableGameTests = false
        enableClientGameTests = true
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            // ./gradlew :fabric:runClient -Pselfcheck loads every mixin target and quits (see SelfCheck)
            if (project.hasProperty('selfcheck')) {
                vmArg '-Dquickstack.selfcheck=true'
            }
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
loom.remapConfigurations.configureEach {
    configurations.named(it.name) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
